name: Deploy documentation

on:
  push:
    branches: [main]
  # Build pull requests too, so a wrong name, default or broken link is caught
  # before it reaches main. Without this the first job that validates a change
  # is the one already deploying it.
  pull_request:
    branches: [main]
  workflow_dispatch:        # lets you republish by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The site is built by v2/build.py (standard library only, nothing to install).
      - name: Build site
        run: python -I v2/build.py

      # Every node, setting, event and default named on a page must exist in the
      # APS source model (v2/tools/model.json), spelled as the editor shows it,
      # and every link and section anchor must resolve. Fails the build if not.
      - name: Check the pages against the APS source
        run: python -I v2/tools/check_docs.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: v2/_site

  deploy:
    needs: build
    # Pull requests are validated by the build job above but never published.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
