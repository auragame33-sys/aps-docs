name: Deploy documentation

on:
  push:
    branches: [main]
  # Build pull requests too, so a broken link or a page missing from nav is
  # caught before it reaches main. Without this the first job that validates a
  # change is the one already deploying it.
  pull_request:
    branches: [main]
  workflow_dispatch:        # lets you republish by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check the single-file docs are up to date
        run: python tools/build_all_in_one.py --check

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    # Pull requests are validated by the build job above but never published.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
